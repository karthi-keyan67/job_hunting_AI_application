services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_hunting}
      POSTGRES_USER: ${POSTGRES_USER:-job_hunting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_hunting}
      POSTGRES_USER: ${POSTGRES_USER:-job_hunting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-}
      APP_ENV: ${APP_ENV:-development}
      RESUME_STORAGE_ROOT: /data/resumes
      MAX_RESUME_UPLOAD_BYTES: ${MAX_RESUME_UPLOAD_BYTES:-5242880}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MATCHING_AI_ENABLED: ${MATCHING_AI_ENABLED:-false}
      MATCHING_TIMEOUT_SECONDS: ${MATCHING_TIMEOUT_SECONDS:-20}
      MATCHING_WEIGHTS: ${MATCHING_WEIGHTS:-}
      MATCHING_MAX_BATCH: ${MATCHING_MAX_BATCH:-50}
      MATCHING_MAX_AI_CALLS: ${MATCHING_MAX_AI_CALLS:-8}
      MATCHING_RATE_LIMIT_PER_MINUTE: ${MATCHING_RATE_LIMIT_PER_MINUTE:-10}
      APPLICATION_GENERATION_DAILY_LIMIT: ${APPLICATION_GENERATION_DAILY_LIMIT:-10}
      APPLICATION_GENERATION_TIMEOUT_SECONDS: ${APPLICATION_GENERATION_TIMEOUT_SECONDS:-45}
      AUTOMATION_TIMEZONE: ${AUTOMATION_TIMEZONE:-Asia/Kolkata}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-10}
      AUTH_LOGIN_WINDOW_MINUTES: ${AUTH_LOGIN_WINDOW_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - resume_data:/data/resumes
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_hunting}
      POSTGRES_USER: ${POSTGRES_USER:-job_hunting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MATCHING_AI_ENABLED: ${MATCHING_AI_ENABLED:-false}
      MATCHING_TIMEOUT_SECONDS: ${MATCHING_TIMEOUT_SECONDS:-20}
      MATCHING_WEIGHTS: ${MATCHING_WEIGHTS:-}
      MATCHING_MAX_BATCH: ${MATCHING_MAX_BATCH:-50}
      MATCHING_MAX_AI_CALLS: ${MATCHING_MAX_AI_CALLS:-8}
      MATCHING_RATE_LIMIT_PER_MINUTE: ${MATCHING_RATE_LIMIT_PER_MINUTE:-10}
      AUTOMATION_TIMEZONE: ${AUTOMATION_TIMEZONE:-Asia/Kolkata}
      COLLECTION_TIMEOUT_SECONDS: ${COLLECTION_TIMEOUT_SECONDS:-300}
      COLLECTION_RETRY_ATTEMPTS: ${COLLECTION_RETRY_ATTEMPTS:-3}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  backend-test:
    profiles: ["verification"]
    build:
      context: ./backend
      target: verification
    environment:
      POSTGRES_DB: ${VERIFY_DATABASE_NAME:-job_hunting_verify}
      POSTGRES_USER: ${POSTGRES_USER:-job_hunting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ""
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-job_hunting}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${VERIFY_DATABASE_NAME:-job_hunting_verify}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RESUME_STORAGE_ROOT: /tmp/job-hunting-resumes-test
      MAX_RESUME_UPLOAD_BYTES: ${MAX_RESUME_UPLOAD_BYTES:-5242880}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MATCHING_AI_ENABLED: ${MATCHING_AI_ENABLED:-false}
      MATCHING_TIMEOUT_SECONDS: ${MATCHING_TIMEOUT_SECONDS:-20}
      MATCHING_WEIGHTS: ${MATCHING_WEIGHTS:-}
      MATCHING_MAX_BATCH: ${MATCHING_MAX_BATCH:-50}
      MATCHING_MAX_AI_CALLS: ${MATCHING_MAX_AI_CALLS:-8}
      MATCHING_RATE_LIMIT_PER_MINUTE: ${MATCHING_RATE_LIMIT_PER_MINUTE:-10}
      APPLICATION_GENERATION_DAILY_LIMIT: ${APPLICATION_GENERATION_DAILY_LIMIT:-10}
      APPLICATION_GENERATION_TIMEOUT_SECONDS: ${APPLICATION_GENERATION_TIMEOUT_SECONDS:-45}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q"]

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  resume_data:
